name: Build

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'  # 1 AM every Monday (UTC)
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: metacall/guix
  BUILDKIT_VERSION: 0.30.0

jobs:
  build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { docker: linux/amd64, guix: x86_64-linux },
          { docker: linux/386, guix: i686-linux },
          { docker: linux/arm/v7, guix: armhf-linux },
          { docker: linux/arm64/v8, guix: aarch64-linux },
          { docker: linux/ppc64le, guix: powerpc64le-linux },
          { docker: linux/riscv64, guix: riscv64-linux }
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v3
        with:
          version: v${{ env.BUILDKIT_VERSION }}

      - name: Verify Docker BuildX Version
        run: docker buildx version

      - name: Create a new builder instance
        run: docker buildx create --use --name insecure-builder --buildkitd-flags '--allow-insecure-entitlement security.insecure'

      - name: Authenticate to Docker registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        # Stop before the job limit so a timeout is a failure instead of a cancellation
        timeout-minutes: 320
        with:
          platforms: ${{ matrix.platform.docker }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=docker.io/${{ env.REGISTRY_IMAGE }},push-by-digest=${{ github.event_name != 'pull_request' }},name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.REGISTRY_IMAGE }}
          allow: security.insecure
          build-args: |
            METACALL_GUIX_ARCH=${{ matrix.platform.guix }}
          cache-from: type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}

      - name: Test (local)
        if: ${{ github.event_name == 'pull_request' && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --privileged --pull=never --platform ${{ matrix.platform.docker }} -v $(pwd)/test/:/root/test/ ${{ env.REGISTRY_IMAGE }} bash /root/test/test.sh

      - name: Test (remote)
        if: ${{ github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --privileged --platform ${{ matrix.platform.docker }} -v $(pwd)/test/:/root/test/ docker.io/${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }} bash /root/test/test.sh

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${{ matrix.platform.docker }}" > "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: digests-${{ matrix.platform.guix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 3

      - name: Report skipped platform
        if: ${{ failure() && github.event_name != 'pull_request' && steps.build.outcome == 'failure' }}
        run: |
          echo "::warning::Build for ${{ matrix.platform.guix }} failed or timed out, no new image was pushed for this platform"
          echo "- :warning: \`${{ matrix.platform.guix }}\` failed or timed out, no new image was pushed" >> $GITHUB_STEP_SUMMARY

  merge:
    name: Merge digests for the manifest
    runs-on: ubuntu-latest
    # Build jobs fail if their platform failed or timed out, so run anyway unless cancelled
    # This will publish new releases whenever they are available for any architecture
    # The platforms not rebuilt keep their previous image, so we have opportunistic releases
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        # There may be no digests if all the platforms failed
        continue-on-error: true
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v${{ env.BUILDKIT_VERSION }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Authenticate to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve digests
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          : > /tmp/sources
          : > /tmp/platforms

          # Registries may report linux/arm64/v8 as linux/arm64
          normalize() { sed -E 's#^linux/arm64/v8$#linux/arm64#'; }

          # Print the platform and digest of each image in a manifest list
          platform_digests() {
            jq -r '.manifests[]? | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end) \(.digest)"' \
              | while read -r platform digest; do
                echo "$(echo "${platform}" | normalize) ${digest}"
              done
          }

          # Add the images built in this run, each digest file contains its platform
          for file in /tmp/digests/*; do
            [ -f "${file}" ] || continue
            platform=$(normalize < "${file}")
            echo "${platform}" >> /tmp/platforms
            echo "docker.io/${{ env.REGISTRY_IMAGE }}@sha256:$(basename "${file}")" >> /tmp/sources
            echo "New image for ${platform}"
          done

          if [ ! -s /tmp/sources ]; then
            echo "::error::No platform was rebuilt"
            exit 1
          fi

          # Fill the platforms that were not rebuilt with the images from the current manifest
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect --raw docker.io/${{ env.REGISTRY_IMAGE }}:latest > /tmp/latest.json; then
              break
            fi
            if [ "${attempt}" = "3" ]; then
              echo "Failed to inspect the current manifest"
              exit 1
            fi
            sleep 30
          done

          platform_digests < /tmp/latest.json \
            | while read -r platform digest; do
              if ! grep -qxF "${platform}" /tmp/platforms; then
                echo "${platform}" >> /tmp/platforms
                echo "docker.io/${{ env.REGISTRY_IMAGE }}@${digest}" >> /tmp/sources
                echo "Keeping previous image for ${platform}"
              fi
            done

          # Fill the platforms that are not in the current manifest either (e.g. dropped by an older merge)
          # with the image from the most recent tag that contains them, the platforms must match the build matrix
          tags=""
          for platform in linux/amd64 linux/386 linux/arm/v7 linux/arm64 linux/ppc64le linux/riscv64; do
            if grep -qxF "${platform}" /tmp/platforms; then
              continue
            fi

            if [ -z "${tags}" ]; then
              tags=$(curl -fsSL --retry 3 "https://registry.hub.docker.com/v2/repositories/${{ env.REGISTRY_IMAGE }}/tags?page_size=100&ordering=last_updated" \
                | jq -r '.results[].name' | grep -vxF latest || true)
            fi

            found=""
            for tag in ${tags}; do
              digest=$( (docker buildx imagetools inspect --raw "docker.io/${{ env.REGISTRY_IMAGE }}:${tag}" 2>/dev/null || true) \
                | platform_digests | awk -v platform="${platform}" '$1 == platform && !found { print $2; found = 1 }')
              if [ -n "${digest}" ]; then
                echo "${platform}" >> /tmp/platforms
                echo "docker.io/${{ env.REGISTRY_IMAGE }}@${digest}" >> /tmp/sources
                echo "Restoring image for ${platform} from tag ${tag}"
                found="yes"
                break
              fi
            done

            if [ -z "${found}" ]; then
              echo "::warning::No image found for ${platform} in any tag, it will be missing from the manifest"
            fi
          done

      - name: Set the version and tag name
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/release
          printf "$(date +'%Y%m%d')" &> /tmp/release/VERSION
          echo "tag_name=v$(cat /tmp/release/VERSION)" >> $GITHUB_ENV

      - name: Upload version artifact
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: version
          path: /tmp/release/*
          if-no-files-found: error

      - name: Create manifest list and push
        run: |
          IMAGE_HASHES=$(cat /tmp/sources | xargs)
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:latest $IMAGE_HASHES

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ env.tag_name }} $IMAGE_HASHES
          fi

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest

  tarball:
    name: Generate Guix Tarballs & Cache
    # The implicit success() also checks the build jobs (transitive dependencies), which may have failed
    # So run whenever the merge succeeded, even if some platforms of the build failed
    if: ${{ !cancelled() && needs.merge.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs:
      - merge
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        platform: [
          "x86_64-linux",
          "i686-linux",
          "armhf-linux",
          "aarch64-linux",
          "powerpc64le-linux",
          "riscv64-linux"
        ]
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v3
        with:
          version: v${{ env.BUILDKIT_VERSION }}

      - name: Verify Docker BuildX Version
        run: docker buildx version

      - name: Create release folder
        run: mkdir -p ./.release

      - name: Download version
        uses: actions/download-artifact@v7.0.0
        with:
          name: version
          path: ./.release/

      - name: Build image ${{ matrix.platform }}
        id: tarball
        # Stop before the job limit so a timeout is a failure instead of a cancellation
        # If it fails, the release will point to the previous tarball of this platform
        timeout-minutes: 320
        run: |
          node release.js ${{ matrix.platform }}
          rm -rf ./out/.gitkeep

      - name: Upload tarball artifact
        # There are no files if the image has not changed since the latest release
        if: ${{ steps.tarball.outcome == 'success' && hashFiles('out/*') != '' }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: tarball-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

      - name: Report unchanged tarball
        if: ${{ steps.tarball.outcome == 'success' && hashFiles('out/*') == '' }}
        run: |
          echo "::notice::Image for ${{ matrix.platform }} has not changed since the latest release, the release will point to the previous tarball"
          echo "- :information_source: \`${{ matrix.platform }}\` image has not changed, the release points to the previous tarball" >> $GITHUB_STEP_SUMMARY

      - name: Report skipped tarball
        if: ${{ failure() && steps.tarball.outcome == 'failure' }}
        run: |
          echo "::warning::Tarball for ${{ matrix.platform }} failed or timed out, the release will point to the previous one"
          echo "- :warning: \`${{ matrix.platform }}\` tarball failed or timed out, the release points to the previous one" >> $GITHUB_STEP_SUMMARY

  release:
    name: Release Guix Tarballs & Cache
    # Tarball jobs fail if their platform failed or timed out, so release anyway unless cancelled
    # It is skipped only if the tarballs did not run at all (the merge failed)
    if: ${{ !cancelled() && needs.tarball.result != 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs:
      - tarball
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tarball artifacts for all architectures
        uses: actions/download-artifact@v7.0.0
        # There may be no tarballs if all of them failed
        continue-on-error: true
        with:
          pattern: tarball-*
          merge-multiple: true
          path: out/

      - name: Create release folder
        run: mkdir -p ./.release

      - name: Download version
        uses: actions/download-artifact@v7.0.0
        with:
          name: version
          path: ./.release/

      - name: Release
        # Fails if a resource is missing, but the files available are still released
        continue-on-error: true
        run: node release.js

      - name: Set the tag name
        run: |
          echo "tag_name=v$(cat ./.release/VERSION)" >> $GITHUB_ENV
          echo "name=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: .release/*
          fail_on_unmatched_files: true
          name: Guix Release Snapshot (${{ env.name }})
          tag_name: ${{ env.tag_name }}
